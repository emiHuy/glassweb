<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phase 0 Skeleton</title>
</head>
<body>
    <h1>Project Skeleton</h1>
    <p id="status">Checking backend...</p>

    <script>
        fetch('http://localhost:8000/health')
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    document.getElementById('status').innerText = "backend reachable.";
                }
            })
            .catch(error => {
                document.getElementById('status').innerText = "Backend unreachable!";
            });
    </script>
</body>
</html>
